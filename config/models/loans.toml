# Interest Income on Loans — METHODOLOGY SWITCHES (committed, non-confidential)
#
# Physical bindings — workbook path, sheet names, header rows, column headers,
# unit scales, launch point, scenario name — live in the company-local config's
# [firm_data.loans] section (see config/company.template.toml), together with
# the compare-mode toggles (results_sheet, cre_results_sheet, apply_scalar),
# which bind to company-specific results sheets. This file carries the
# decision-bearing switches, so they can be reviewed in git next to the PID
# registry that justifies them. Compose the two through a run manifest
# (config/runs/company.toml or config/runs/example.toml); a key defined in both
# files is a hard error, never a silent override — activating a switch here
# means deleting it from the sources file if it is set there too.
#
# Former candidate switches deliberately absent, because they are FIXED by
# PIDs, not configurable: the base-rate fallback is 0 (PID-LOAN-4 amendment,
# always censused by cause); wt > 1 is always surfaced, never clamped
# (PID-LOAN-6); the variable-type map 0/1/2/3/4/[NULL] is pinned by
# PID-LOAN-2/9 and an unmapped code refuses.
#
# Computation: docs/specifications/interest-income/loans/ii_loans_corporate.spec.md
# The Federal Reserve model is PROPOSED for the 2026 stress test, NOT adopted.

[firm_data.loans]
floor_collapse = "balance_weighted"   # PID-LOAN-7: CORP H.1 floors are per facility,
                                      # the model projects one rate per segment.
                                      # "balance_weighted" (default) | "max" | "min";
                                      # within-segment dispersion is logged either way.
                                      # FLAGGED — awaiting confirmation of what the
                                      # workbook itself does.
cre_orig_date_statistic = "weighted_median"   # PID-LOAN-22 as amended: the
                                      # origination-date statistic is the
                                      # OUTSTANDING-weighted MEDIAN — identified by
                                      # the first compare (the reference's
                                      # median-date cells are observed dates; the
                                      # mean missed construction fixed by one
                                      # quarter, 1.0447). "weighted_mean" kept for
                                      # A/B. ACTIVATED 2026-08-14, user-confirmed:
                                      # the validated company config sets exactly
                                      # this value. NOTE the code's config-path
                                      # fallback when the key is absent is
                                      # "weighted_mean" (config.py _parse_loans) —
                                      # pinning the median here protects runs from
                                      # that refuted default.

