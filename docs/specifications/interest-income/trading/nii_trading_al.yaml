    - {id: OQ-007, via: PID-TRD-2/PID-TRD-3, topic: "ratio->dollar step — multiplication, multiplicand (R30 - R112, flat), and annualized-/4 basis all observed at the reference cells (2026-08-13); source-side absence preserved; quarterly-vs-annualized LHS tension recorded"}
