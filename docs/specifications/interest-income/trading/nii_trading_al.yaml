  - {id: D-005, scope: project_wide, summary: launch point (PQ0) terminology; source words preserved in quotes}
  - {id: D-006, scope: project_wide, summary: USD millions canonical; declared money scale; units-mismatch screens}
  - {id: D-007, scope: project_wide, summary: two-sheet firm-input contract; frb_* paths on the quarterly sheet}
  - {id: D-008, scope: project_wide, summary: FRB path sign convention — income and NII pass through as-entered}
  - {id: PID-TRD-1, summary: "nine-quarter cumulative calibration of alpha_b against the FRB total-interest-income residual (fixed_effect block); PQ0 actuals never used; supersedes D-002 for this model; closed form amended same day by PID-TRD-3"}
  - {id: PID-TRD-2, summary: "physical inputs: sheet '14Q Sch G' cells R30 (trading assets) / R112 (trading liabilities), panel labels 13/37 read as the worksheet line items [INT]; beta via FRB-provided coefficients = published 0.278"}
  - {id: PID-TRD-3, summary: "ratio basis = ANNUALIZED rate with /4 at the dollar step (screenshot-observed, arithmetic verified); closed form takes the PID-OB-5 shape WITH x4; quarterly-LHS source-literal reading retained as recorded tension"}
  - {id: PID-OB-5, scope: ie_other_borrowing, summary: "the mirrored expense-side calibration pattern (precedent, not an input)"}

