  open:
    - {id: OQ-005, topic: hedge-adjustment allocation across components}
    - {id: OQ-023, topic: "FRB path sourcing — EXTENDED 2026-08-13: hardcoded summary numbers; income-path scope implied-by-construction; per-path scope alignment TO_BE_CONFIRMED"}
